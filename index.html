<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Central de Jogos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0f0f13; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    .hidden { display: none !important; }
    header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
    h1 { font-size: 22px; color: #00FFFF; }
    .back-btn { background: #d9534f; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
    .game-card { background: #1a1a24; border: 2px solid #333; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .game-card:hover { transform: translateY(-3px); border-color: #00FFFF; }
    .game-card h3 { font-size: 20px; margin-bottom: 10px; }
    .game-card p { font-size: 14px; color: #aaa; margin-bottom: 15px; }
    .play-btn { background: #00FFFF; color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
    #game-container { width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; }
    iframe { width: 100%; height: 750px; border: 2px solid #333; border-radius: 12px; background: #000; }
    @media (max-width: 600px) { iframe { height: 620px; } }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Arcade Hub</h1>
    <button id="btn-back" class="back-btn hidden" onclick="closeGame()">◀ Sair do Jogo</button>
  </header>

  <div id="selection-menu" class="game-grid">
    <div class="game-card" onclick="loadGame('tiro.html')">
      <h3>🚀 Space Shooter</h3>
      <p>Jogo de tiro espacial com skins, bomba e boss!</p>
      <button class="play-btn">Jogar Agora</button>
    </div>
  </div>

  <div id="game-container" class="hidden">
    <iframe id="game-frame" src="" frameborder="0" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <script>
    const selectionMenu = document.getElementById('selection-menu');
    const gameContainer = document.getElementById('game-container');
    const gameFrame = document.getElementById('game-frame');
    const btnBack = document.getElementById('btn-back');

    function loadGame(url) {
      gameFrame.src = url;
      selectionMenu.classList.add('hidden');
      gameContainer.classList.remove('hidden');
      btnBack.classList.remove('hidden');
    }

    function closeGame() {
      gameFrame.src = '';
      gameContainer.classList.add('hidden');
      btnBack.classList.add('hidden');
      selectionMenu.classList.remove('hidden');
    }
  </script>
</body>
</html>
